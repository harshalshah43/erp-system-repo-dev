<html>
        <head>
            <title>Products</title>
        </head>
        <body>
            <h1>Products</h1>
            <table border = "1">
                <tr>
                    <th>ProductID</th>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Stock Qty</th>
                    <th>Supplier ID</th>
                    <th>Action</th>
                </tr>
                {% for product in products %}
                 <tr>
                    <td>{{product.productid}}</td>
                    <td>{{product.productname}}</td>
                    <td>{{product.price}}</td>
                    <td>{{product.stock_quantity}}</td>
                    <td>{{product.supplierid}}</td>
                    <td><a href = "/product/edit/{{product.productid}}">Edit</a></td>
                </tr>
                {% endfor %}
            </table>
            <a href = "/product/add"><button type = 'button'>Add New</button></a>
        </body>
    </html>
