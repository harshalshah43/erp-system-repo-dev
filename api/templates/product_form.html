<html>
        <head>
            <title>Product Form - Add New Product</title>
        </head>
        <body>
            <h1>Product Form - Add New Product</h1>
            <form method="POST" action="/product/add">
                <label>Product Name:<br>
                    <input type="text" name="product_name" required>
                </label><br><br>

                <label>Price:<br>
                    <input type="number" step="0.01" min="0.01" name="price" required>
                </label><br><br>

                <label>Stock Quantity:<br>
                    <input type="number" min="0" name="stock_quantity" required>
                </label><br><br>

                <label>Supplier ID:<br>
                    <input type="number" min="1" name="supplier_id" required>
                </label><br><br>

                <button type="submit">Add Product</button>
            </form>
        </body>
    </html>
