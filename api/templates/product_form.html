<html>
        <head>
            <title>Product Form - {{ "Edit Product" if product else "Add New Product" }}</title>
        </head>
        <body>
            <h1>Product Form - {{ "Edit Product" if product else "Add New Product" }}</h1>

            {% if error %}
            <p style="color: red;">{{ error }}</p>
            {% endif %}

            <form method="POST" action="{{ '/product/edit/' ~ product.productid if product else '/product/add' }}">
                <label>Product Name:<br>
                    <input type="text" name="product_name" value="{{ product.productname if product else '' }}" required>
                </label><br><br>

                <label>Price:<br>
                    <input type="number" step="0.01" min="0.01" name="price" value="{{ product.price if product else '' }}" required>
                </label><br><br>

                <label>Stock Quantity:<br>
                    <input type="number" min="0" name="stock_quantity" value="{{ product.stock_quantity if product else '' }}" required>
                </label><br><br>

                <label>Supplier ID:<br>
                    <input type="number" min="1" name="supplier_id" value="{{ product.supplierid if product else '' }}" required>
                </label><br><br>

                <button type="submit">{{ "Save Changes" if product else "Add Product" }}</button>
            </form>
        </body>
    </html>
