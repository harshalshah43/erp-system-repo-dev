<html>
        <head>
            <title>Order Form - Add New Order</title>
        </head>
        <body>
            <h1>Order Form - Add New Order</h1>

            {% if error %}
            <p style="color: red;">Error: {{ error }}</p>
            {% endif %}


            <form method="POST" action="/orders/add">

                <label>Product ID:<br>
                    <input type="number" step="0.01" min="0.01" name="productid" required>
                </label><br><br>

                <label>Order Date:<br>
                    <input type="date" min="0" name="order_date" required>
                </label><br><br>

                <label>Quantity Ordered:<br>
                    <input type="number" min="1" name="quantity_ordered" required>
                </label><br><br>

                <button type="submit">Add New Order</button>
            </form>
        </body>
    </html>
