<html>
    <head>
        <title>Products</title>
    </head>
    <body>
        <h1>Products</h1>
        <table border="1">
            <tr>
                <th>Product ID</th>
                <th>Product Name</th>
                <th>Price</th>
                <th>Stock Qty</th>
                <th>Supplier ID</th>
             </tr>
            {% for product in products %}
                <tr>
                        <td>{{product.productid}}</td>
                        <td>{{product.productname}}</td>
                        <td>{{product.price}}</td>
                        <td>{{product.stock_quantity}}</td>
                        <td>{{product.supplierid}}</td>
                </tr>
             {% endfor %}
        </table>
                        
        <a href="/products/add" style="display: inline-block; margin-top: 20px;"><button type="button">Add a new Product</button></a>
                
    </body>
</html>
